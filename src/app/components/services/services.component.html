<section class="section services" id="servicios" aria-labelledby="services-heading">
  <div class="container">

    <!-- Header -->
    <div class="section-header">
      <span class="section-label">Nuestros Servicios</span>
      <h2 class="heading-lg" id="services-heading">
        Todo lo que necesitas para<br>
        <span class="text-gold">tu trámite de extranjería</span>
      </h2>
      <p class="section-desc">
        Cubrimos todos los trámites migratorios en España con profesionalismo y transparencia.
        Selecciona el que necesitas y contáctanos.
      </p>
    </div>

    <!-- Cards Grid -->
    <div class="services__grid">
      <article
        class="service-card"
        *ngFor="let service of services; let i = index"
        [attr.aria-label]="service.title">

        <!-- Tag -->
        <span class="service-card__tag" *ngIf="service.tag">{{ service.tag }}</span>

        <!-- Icon -->
        <div class="service-card__icon">
          <!-- Home / Arraigos -->
          <svg *ngIf="service.icon === 'home'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <!-- Globe / Visados -->
          <svg *ngIf="service.icon === 'globe'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <!-- Flag / Nacionalidad -->
          <svg *ngIf="service.icon === 'flag'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          <!-- Users / Reagrupación -->
          <svg *ngIf="service.icon === 'users'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <!-- Refresh / NIE -->
          <svg *ngIf="service.icon === 'refresh'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <!-- Family -->
          <svg *ngIf="service.icon === 'family'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <!-- Briefcase -->
          <svg *ngIf="service.icon === 'briefcase'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <!-- Laptop -->
          <svg *ngIf="service.icon === 'laptop'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
          <!-- Star -->
          <svg *ngIf="service.icon === 'star'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <!-- Book -->
          <svg *ngIf="service.icon === 'book'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <!-- Shield -->
          <svg *ngIf="service.icon === 'shield'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <!-- Gavel -->
          <svg *ngIf="service.icon === 'gavel'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 6l-1-2H5v17h2v-7h5l1 2h7V6h-6z"/></svg>
        </div>

        <h3 class="service-card__title">{{ service.title }}</h3>
        <p class="service-card__desc">{{ service.desc }}</p>

        <a href="#consulta" class="service-card__link" [attr.aria-label]="'Consultar sobre ' + service.title">
          Consultar
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
      </article>
    </div>

  </div>
</section>
