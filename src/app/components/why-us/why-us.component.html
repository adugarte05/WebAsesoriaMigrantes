<section class="section why-us section--dark" id="nosotros" aria-labelledby="why-us-heading">
  <div class="container">

    <div class="why-us__inner">

      <!-- Left: Stats -->
      <div class="why-us__stats">
        <span class="section-label">Por qué elegirnos</span>
        <h2 class="heading-lg why-us__title" id="why-us-heading">
          Más de <span class="text-gold">10 años</span><br>
          ayudando a inmigrantes<br>
          en España
        </h2>

        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-item__num">+500</span>
            <span class="stat-item__label">Casos resueltos</span>
          </div>
          <div class="stat-item">
            <span class="stat-item__num">98%</span>
            <span class="stat-item__label">Tasa de éxito</span>
          </div>
          <div class="stat-item">
            <span class="stat-item__num">12+</span>
            <span class="stat-item__label">Tipos de trámites</span>
          </div>
          <div class="stat-item">
            <span class="stat-item__num">24h</span>
            <span class="stat-item__label">Tiempo de respuesta</span>
          </div>
        </div>
      </div>

      <!-- Right: Features -->
      <div class="why-us__features">
        <div class="feature-item" *ngFor="let f of features">
          <div class="feature-item__icon">
            <svg *ngIf="f.icon === 'shield-check'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
            <svg *ngIf="f.icon === 'translate'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/></svg>
            <svg *ngIf="f.icon === 'clock'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <svg *ngIf="f.icon === 'lock'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div class="feature-item__content">
            <h3 class="feature-item__title">{{ f.title }}</h3>
            <p class="feature-item__desc">{{ f.desc }}</p>
          </div>
        </div>
      </div>

    </div>

  </div>
</section>
